<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Escolar</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <div id="quiz">

            <h1>🏆 Quiz Escolar</h1>

            <div class="topo">
                <span id="contador">Pergunta 1 de 10</span>
                <span id="pontuacao">Pontos: 0</span>
            </div>

            <div class="barra">
                <div id="progresso"></div>
            </div>

            <h2 id="pergunta">Pergunta</h2>

            <div id="opcoes"></div>

            <button id="botaoProximo" disabled>
                Próxima pergunta
            </button>

        </div>

        <div id="resultado" class="escondido">

            <h1>🎉 Fim do Quiz!</h1>

            <h2 id="pontuacaoFinal"></h2>

            <p id="mensagemFinal"></p>

            <button id="botaoReiniciar">
                Jogar novamente
            </button>

        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
