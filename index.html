<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz de Conhecimentos Gerais</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <div id="quiz">
            <h1>🏆 Quiz de Conhecimentos Gerais</h1>

            <div class="info">
                <span id="contador">Pergunta 1 de 10</span>
                <span id="pontuacao">Pontos: 0</span>
            </div>

            <div class="barra">
                <div id="progresso"></div>
            </div>

            <h2 id="pergunta">Pergunta</h2>

            <div id="opcoes" class="opcoes"></div>

            <button id="proxima" onclick="proximaPergunta()" disabled>
                Próxima pergunta
            </button>
        </div>

        <div id="resultado" class="resultado escondido">
            <h1>🎉 Quiz finalizado!</h1>
            <p id="mensagem"></p>
            <h2 id="resultadoPontuacao"></h2>
            <button onclick="reiniciarQuiz()">Jogar novamente</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
